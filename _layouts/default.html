<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/vestment.css' | relative_url }}?v=mobile-logo-2">
  <script src="{{ '/assets/js/vestment.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include vestment-header.html %}
  <main id="main-content" {% unless page.homepage %}class="page-content"{% endunless %}>
    {% if page.homepage %}{{ content }}{% else %}<div class="wrapper">{{ content }}</div>{% endif %}
  </main>
  {% include vestment-footer.html %}
</body>
</html>
